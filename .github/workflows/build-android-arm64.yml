name: Build Android ARM64 High-UDP

on:
  workflow_dispatch:
  push:
    branches: ["fix-notun-high-udp"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  build-android-arm64:
    runs-on: ubuntu-latest
    env:
      NAME: easytier
      TARGET: aarch64-linux-android
      ARCH: aarch64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
          packages: 'build-tools;34.0.0 ndk;26.0.10792818 platform-tools platforms;android-34 '

      - name: Setup Android Environment
        run: |
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/ndk/26.0.10792818/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.0.10792818/" >> $GITHUB_ENV

      - name: Prepare build environment
        uses: ./.github/actions/prepare-build
        with:
          target: aarch64-linux-android
          gui: false
          pnpm: true
          pnpm-build-filter: ''
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ""
          shared-key: "gui-registry"
          cache-targets: "false"

      - name: Build Android ARM64 APK
        run: |
          cd easytier-gui
          pnpm tauri android build --apk --target aarch64 --split-per-abi

      - name: Collect artifact
        run: |
          mkdir -p ./artifacts
          cp -v easytier-gui/src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk ./artifacts/
          ls -lh ./artifacts/

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v5
        with:
          name: easytier-android-arm64-highudp
          path: ./artifacts/*.apk
